# Verification only: the caller has already selected the probe and target.
# Keep Tcl in a file so Windows PowerShell does not reinterpret its quotes.
init
halt
set compare_failed [catch {
    verify_image firmware_direct/stm32f407_bt_oled.hex
} compare_message]
# Resume the original running program after either comparison outcome.
resume
if {$compare_failed} {
    echo CURRENT_FIRMWARE_MISMATCH
    echo $compare_message
} else {
    echo CURRENT_FIRMWARE_VERIFIED
}
shutdown
